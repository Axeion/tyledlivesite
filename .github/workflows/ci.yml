name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tyled
          POSTGRES_PASSWORD: tyled
          POSTGRES_DB: tyled_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tyled -d tyled_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tyled:tyled@localhost:5432/tyled_test
      TEST_DATABASE_URL: postgresql://tyled:tyled@localhost:5432/tyled_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          PLATFORM_DOMAIN: tyled.live
